# ════════════════════════════════════════════════════════════
#  Eletroguin — Configuração Nginx para Produção
#  Ficheiro: /etc/nginx/sites-available/eletroguin
# ════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name eletroguin.gw www.eletroguin.gw;

    # Redirecionar para HTTPS em produção
    # return 301 https://$host$request_uri;

    # ── Frontend estático ──────────────────────────────────
    root /var/www/eletroguin;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API (proxy para Node.js) ───────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Tamanho máximo de upload (deve coincidir com MAX_FILE_SIZE_MB no .env)
        client_max_body_size 25M;

        # Timeouts mais longos para uploads grandes
        proxy_read_timeout    120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
    }

    # ── Ficheiros de upload (servidos directamente pelo Nginx) ─
    # Mais eficiente do que passar pelo Node.js
    location /uploads/ {
        alias /var/www/eletroguin-uploads/;

        # Tipos de conteúdo
        types {
            application/pdf  pdf;
            application/msword doc;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
            application/vnd.ms-excel xls;
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
            text/csv csv;
            image/jpeg jpg jpeg;
            image/png  png;
        }

        # PDFs abrem no browser (não forçam download)
        add_header Content-Disposition "inline";

        # Cache de 30 dias para ficheiros estáticos
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Bloquear listagem de directórios
        autoindex off;

        # Apenas GET e HEAD
        limit_except GET HEAD {
            deny all;
        }
    }

    # ── Health check ───────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3001;
    }

    # ── Segurança ──────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "no-referrer-when-downgrade" always;

    # Esconder versão do Nginx
    server_tokens off;
}

# ════════════════════════════════════════════════════════════
#  Comandos de configuração no servidor (Ubuntu/Debian)
# ════════════════════════════════════════════════════════════
# 
# # 1. Criar pasta de uploads com permissões correctas
# sudo mkdir -p /var/www/eletroguin-uploads/{projetos,relatorios,geral}
# sudo chown -R www-data:www-data /var/www/eletroguin-uploads
# sudo chmod -R 755 /var/www/eletroguin-uploads
#
# # 2. No .env do servidor, apontar para essa pasta:
# UPLOAD_DIR=/var/www/eletroguin-uploads
# PUBLIC_URL=https://eletroguin.gw
#
# # 3. Activar o site
# sudo ln -s /etc/nginx/sites-available/eletroguin /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# # 4. SSL com Let's Encrypt
# sudo certbot --nginx -d eletroguin.gw -d www.eletroguin.gw
# ════════════════════════════════════════════════════════════